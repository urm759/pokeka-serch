name: Data Update Health Watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Daily Fast Update, Safe Checkpoint Backfill, PokeDATA Incremental Backfill, Priority Purchase Price Refresh]
    types: [completed]
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check alert deduplication and safe backoff rules
        run: |
          node work/test_update_health.js
          node work/test_backfill_health.js
          node work/test_backfill_rate.js
          node work/test_deadline_order.js
          node work/test_scheduled_cycle_evidence.js
          node work/test_automatic_operation.js
      - name: Fill missed price intervals with shared cooldown and access budgets
        run: |
          node work/scheduled_cycle_evidence.js catchup --baseline
          node work/run_priority_price_refresh.js --catchup
      - name: Validate catchup data without changing purchase criteria
        id: catchup_validation
        run: |
          node work/test_price_integrity.js
          node work/test_shop_observation.js
          node work/test_purchase_price_recovery.js
          node work/test_buyback_scenario_limits.js
          node work/test_purchase_limit_audit.js
          node work/test_card_catalog_completion.js
          node work/test_cadence_payload.js
          node work/measure_performance_guard.js
          node work/scheduled_cycle_evidence.js catchup
      - name: Check workflow results and saved checkpoint holds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node work/watch_update_health.js
      - name: Publish changed health state only
        if: always() && steps.catchup_validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node work/build_ui_data.js
          node work/test_ui_data.js
          git add data work
          git add data/ui
          if git diff --cached --quiet; then exit 0; fi
          node work/publish_data_checkpoint.js "Report data update health"
      - name: Preserve unpublished monitor state
        if: failure()
        run: node work/capture_unpublished_data.js health
      - name: Save monitor recovery bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/unpublished-recovery/
            work/publish-recovery.bundle
            work/publish-recovery.json
          retention-days: 7
          if-no-files-found: warn
