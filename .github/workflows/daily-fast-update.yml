name: Daily Fast Update

on:
  workflow_dispatch:
  schedule:
    # 04:30 and 17:00 JST. GitHub cron is UTC.
    - cron: "30 19 * * *"
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Save purchase-price freshness baseline
        run: |
          node work/scheduled_cycle_evidence.js daily --baseline
          node work/build_purchase_limit_audit.js
          node work/audit_purchase_price_recovery.js --baseline
      - name: Run deterministic delta update
        env:
          FAST_DEEP_SCAN: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 19 * * *') && '1' || '0' }}
        run: node work/daily_fast_update.js
      - name: Refresh PSA Japan plans
        run: node work/run_tracked_update.js psaJapan work/update_psa_japan_services.js
      - name: Refresh web buyback tables
        run: node work/run_tracked_update.js shopBuyback work/update_shop_buybacks.js
      - name: Refresh SNKRDUNK raw state-A delta
        env:
          SNKR_RAW_LIMIT: "100"
          SNKR_RAW_MAX_RUNTIME_MS: "360000"
        run: node work/run_tracked_update.js snkrRaw work/update_snkr_raw_flip.js
      - name: Rebuild market demand and supply analysis
        run: node work/run_tracked_update.js marketAnalysis work/build_market_analysis.js
      - name: Recheck candidate shop prices in bounded direct-origin batches
        env:
          CANDIDATE_SHOP_MODE: "deadline"
          CANDIDATE_SHOP_TIME_MS: "180000"
        run: |
          node work/audit_acquisition_progress.js --baseline
          node work/refresh_candidate_shops.js cardrush
          node work/refresh_candidate_shops.js hareruya2
      - name: Finalize source status
        run: node work/finalize_update_status.js
      - name: Audit state-A price conflicts and sale evidence
        run: node work/audit_state_a_prices.js
      - name: Rebuild catalog and shared purchase-limit audit
        run: |
          node work/build_card_completion.js
          node work/build_purchase_limit_audit.js
          node work/build_supply_maturity_hypothesis.js
          SHOP_EFFECT_AUDIT_REF="$GITHUB_SHA" node work/build_purchase_limit_audit.js
          node work/audit_acquisition_progress.js
          node work/audit_link_coverage.js
          node work/audit_purchase_price_recovery.js
          node work/finalize_update_status.js
      - name: Run fast regression tests
        run: |
          node work/build_ui_data.js
          node work/measure_performance_guard.js
          node work/build_ui_data.js
          node work/test_ui_data.js
          node work/test_specification_reexploration.js
          node work/test_performance_guard.js
          node work/test_performance_comparison.js
          node work/test_scheduled_cycle_evidence.js
          node work/test_shop_observation.js
          node work/test_purchase_price_recovery.js
          node work/test_roi_psa9_ratio.js
          node --check app.js
          node --check decision-model.js
          node --check work/daily_fast_update.js
          node --check work/update_snkr_raw_flip.js
          node work/test_snkr_raw_flip.js
          node work/test_limit_tiers.js
          node work/test_limit_display.js
          node work/test_focus_monitor.js
          node work/test_purchase_memo.js
          node work/test_return_reference.js
          node work/test_priority_refresh.js
          node work/test_buyback_scenario_limits.js
          node work/test_purchase_limit_audit.js
          node work/test_preset_exploration.js
          node work/test_current_market_exploration.js
          node work/test_search_calculation_cache.js
          node work/test_price_integrity.js
          node work/test_candidate_daily_audit.js
          node work/test_candidate_availability_audit.js
          node work/test_acquisition_progress.js
          node work/test_checkpoint_publication.js
          node work/test_source_monitor_and_completion.js
          node work/test_completion_routes.js
          node work/test_grade_calibration.js
          node work/test_daily_fast_update.js
          node work/test_proactive_refresh.js
          node work/test_cadence_payload.js
          node work/test_deadline_order.js
          node work/test_psa_market_trial.js
          node work/test_psa_linkage_queue.js
          node work/test_catalog_index_adapter.js
          node work/test_pokedata_set_discovery.js
          node work/test_supply_maturity_hypothesis.js
      - name: Commit changed data only
        run: |
          node work/scheduled_cycle_evidence.js daily
          node work/build_ui_data.js
          node work/test_ui_data.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work/daily-http-cache.json work/changed-card-ids.json work/market_stability_history.json work/snkr-raw-flip-cache.json work/snkr-raw-flip-checkpoint.json work/source-update-runs.json work/source-update-history.json work/toreca-source-inventory.json work/toreca_source_diff.json work/card-new-arrivals.json work/card-lifecycle.json work/candidate-daily-history.json work/candidate-availability-history.json work/candidate-shop-refresh.json work/cardrush_catalog.json work/hareruya2_catalog.json work/cardrush_stock_history.json work/hareruya2_stock_history.json work/acquisition-progress-last.json
          git add work/shop_buyback_history.json work/shop_buyback_catalog.json work/shop_buyback_unmatched.json work/shop_buyback_item_matches.json work/shop_buyback_image_matches.json work/shop_buyback_quarantine.json
          git add work/priority-price-checkpoint.json work/priority-price-http-cache.json
          git add work/purchase-price-targets.json work/purchase-price-observation-snapshot.json work/purchase-price-recovery-baseline.json work/purchase-price-recovery-history.json
          git add work/fixed-price-reference.json work/priority-freshness-history.json
          git add work/completion-outcomes-baseline.json work/completion-outcomes-last.json work/completion-outcome-history work/card-completion-queue.json
          git add work/scheduled-cycle-baseline-daily.json
          if git diff --cached --quiet; then
            echo "No source change. Commit and deployment skipped."
            exit 0
          fi
          node work/publish_data_checkpoint.js "Run deterministic daily delta update"
      - name: Save unpublished source data on failure
        if: failure()
        run: |
          node work/save_backfill_recovery.js daily
      - name: Preserve raw data regardless of metadata errors
        if: failure()
        run: node work/capture_unpublished_data.js daily
      - name: Upload recovery checkpoint if publication or validation failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daily-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/unpublished-recovery/
            work/publish-recovery.bundle
            work/publish-recovery.json
            data/backfill-recovery.json
          retention-days: 7
          if-no-files-found: error
