name: Check published Pages release
run-name: Pages release ${{ github.event.workflow_run.id }} ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check served scripts, integrity, manifest and offline invariants
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in 1 2 3; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$PAGES_WORKFLOW_ID/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
            if [[ "$latest" != "$DEPLOYED_SHA" ]]; then
              echo "A newer deployment has its own verification."
              exit 0
            fi
            if node work/check_pages_release.js; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 20; fi
          done
          exit 1
