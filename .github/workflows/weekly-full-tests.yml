name: Weekly Full Regression Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 6"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax and JSON validation
        run: |
          node --check app.js
          node --check decision-model.js
          node -e "const fs=require('fs'),path=require('path');const walk=p=>fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(p,e.name)):path.extname(e.name)==='.json'?[path.join(p,e.name)]:[]);for(const f of walk('data'))JSON.parse(fs.readFileSync(f,'utf8').replace(/^\\uFEFF/,''));console.log('JSON OK')"
      - name: Full regression suite (runs every test to the end)
        # Each failure is listed in the run summary; the job fails at the end.
        # The hourly monitor turns a failed or missing weekly run into an alert.
        if: success() || failure()
        run: node work/run_weekly_suite.js
      - name: Fixed production-model performance budgets
        if: success() || failure()
        run: |
          node work/measure_performance_guard.js
          node work/test_performance_comparison.js
          node work/test_scheduled_cycle_evidence.js
          node work/test_cycle_observation_snapshot.js
          node work/test_hareruya_single_response.js
          node work/test_calculation_pass_reuse.js
          node work/test_gemrate_listing_relevance.js
          node work/test_watch_catchup_trigger.js
