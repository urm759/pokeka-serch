name: Manual Full Refresh

on:
  workflow_dispatch:
    inputs:
      source:
        description: "更新対象（失敗した取得元だけ再実行できます）"
        required: true
        default: all
        type: choice
        options:
          - all
          - toreca
          - cardrush
          - hareruya2
          - torecacamp
          - pokedata
          - shopBuyback
          - marketAnalysis
          - psaJapan
permissions:
  contents: write

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Update PSA Japan plans and turnaround times
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'psaJapan'
        run: node work/run_tracked_update.js psaJapan work/update_psa_japan_services.js

      - name: Update Pokemon cards and prices
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'toreca'
        env:
          SNKR_BATCH: "0"
        run: node work/run_tracked_update.js toreca work/update_pokemon_site.js

      - name: Link Toreca Camp state-A listings
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'torecacamp'
        timeout-minutes: 10
        env:
          SHOP_SOURCE_ONLY: "torecacamp"
          TORECACAMP_SITEMAPS_PER_RUN: "1"
          TORECACAMP_PRODUCT_DETAIL_BATCH: "100"
          TORECACAMP_RUNTIME_LIMIT_MS: "480000"
          SHOP_FETCH_RETRIES: "2"
          SHOP_FETCH_TIMEOUT_MS: "10000"
          SHOP_ACCESS_INTERVAL_MS: "1100"
        run: node work/run_tracked_update.js torecacamp work/update_yuyutei_torecacamp.js

      - name: Expand PokeDATA validation batch
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'pokedata'
        timeout-minutes: 10
        env:
          POKEDATA_SET: "Battle Partners"
          POKEDATA_TARGET: "132"
          POKEDATA_BATCH: "10"
          POKEDATA_REFRESH_LINKED: "1"
          POKEDATA_INTERVAL_MS: "1100"
          POKEDATA_TIMEOUT_MS: "10000"
        run: node work/run_tracked_update.js pokedata work/update_pokedata_batch.js

      - name: Expand priority PokeDATA set
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'pokedata'
        timeout-minutes: 10
        env:
          POKEDATA_SET: "Terastal Festival ex"
          POKEDATA_TARGET: "629"
          POKEDATA_BATCH: "10"
          POKEDATA_INTERVAL_MS: "1100"
          POKEDATA_TIMEOUT_MS: "10000"
        run: node work/update_pokedata_batch.js

      - name: Expand Japanese Pokemon Card 151 set
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'pokedata'
        timeout-minutes: 10
        env:
          POKEDATA_SET: "Pokemon Card 151 Japanese"
          POKEDATA_TARGET: "516"
          POKEDATA_BATCH: "20"
          POKEDATA_INTERVAL_MS: "1100"
          POKEDATA_TIMEOUT_MS: "10000"
        run: node work/update_pokedata_batch.js

      - name: Reapply authenticated PokeDATA sale captures
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'pokedata'
        run: node work/run_tracked_update.js pokedata work/import_pokedata_browser_capture.js

      - name: Audit PokeDATA matches and build reference research
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'pokedata' || inputs.source == 'marketAnalysis'
        run: |
          node work/audit_pokedata_matches.js
          node work/build_market_research.js
          node work/audit_modern_high_rarity.js

      - name: Resolve all Snkrdunk direct links
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'toreca'
        env:
          SNKR_BATCH: "250"
          SNKR_CONCURRENCY: "20"
          SNKR_CHECKPOINT: "100"
          SNKR_RECHECK_DAYS: "30"
        run: node work/update_snkr_links.js

      - name: Refresh SNKRDUNK raw state-A sales
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'toreca'
        env:
          SNKR_RAW_LIMIT: "180"
          SNKR_RAW_MAX_RUNTIME_MS: "480000"
        run: node work/run_tracked_update.js snkrRaw work/update_snkr_raw_flip.js

      - name: Cache Snkrdunk English names for PSA matching
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'toreca'
        env:
          PSA_ENGLISH_BATCH: "120"
          PSA_ENGLISH_CONCURRENCY: "6"
        run: node work/update_snkr_english_names.js

      - name: Rebuild verified PSA history links
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'toreca'
        run: node work/build_psa_history.js

      - name: Resolve only new or unresolved Cardrush listings
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'cardrush'
        env:
          CARDRUSH_SEED_BATCH: "8"
          CARDRUSH_TARGET_BATCH: "80"
          CARDRUSH_CONCURRENCY: "2"
        run: node work/run_tracked_update.js cardrush work/update_cardrush_links.js

      - name: Record Cardrush stock and audit states
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'cardrush'
        env:
          CARDRUSH_REQUIRE_FRESH: "1"
        run: node work/run_tracked_update.js cardrush work/update_cardrush_stock.js

      - name: Link Hareruya2 state-A listings and record stock
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'hareruya2'
        env:
          HARERUYA2_COLLECTION_BATCH: "12"
          HARERUYA2_COLLECTION_CONCURRENCY: "5"
          HARERUYA2_STOCK_BATCH: "800"
          HARERUYA2_STOCK_CONCURRENCY: "10"
        run: node work/run_tracked_update.js hareruya2 work/update_hareruya2_stock.js

      - name: Verify priority Cardrush direct links from product pages
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'cardrush'
        shell: bash
        run: |
          for id in pk-731 pk-38030 pk-3123 pk-1180 pk-7040 pk-1168 x-141447; do
            CARDRUSH_STOCK_SOURCE=product CARDRUSH_STOCK_ONLY_ID="$id" CARDRUSH_STOCK_FORCE=1 node work/update_cardrush_stock.js
          done

      - name: Record shop PSA10 buyback listings
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'shopBuyback'
        run: node work/run_tracked_update.js shopBuyback work/update_shop_buybacks.js

      - name: Record Snkrdunk PSA10 listing counts
        run: node work/build_snkr_listing_history.js

      - name: Record 91-day market history and rebuild market analysis
        if: github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == 'marketAnalysis'
        run: node work/run_tracked_update.js marketAnalysis work/build_market_analysis.js

      - name: Record daily decisions and rebuild backtest
        run: node work/build_market_backtest.js

      - name: Reapply confirmed manual card aliases
        run: node work/apply_manual_card_aliases.js

      - name: Build ambiguous linkage review queue
        run: node work/build_linkage_review.js

      - name: Relearn sourcing evaluation from current market data
        run: node work/build_evaluation_model.js

      - name: Record link coverage and unresolved counts
        run: node work/audit_link_coverage.js

      - name: Build all-card catalog and completion priority queue
        run: node work/build_card_completion.js

      - name: Finalize source freshness and completed date
        run: node work/finalize_update_status.js

      - name: Verify PokeDATA aggregate consistency
        run: node work/test_pokedata_consistency.js

      - name: Verify market research isolation and boundaries
        run: node work/test_market_research.js

      - name: Verify all-card catalog and incremental completion rules
        run: node work/test_card_catalog_completion.js

      - name: Verify release lifecycle and measured-data classifications
        run: node work/test_catalog_semantics.js

      - name: Commit all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh all Pokemon site data"
          git push
