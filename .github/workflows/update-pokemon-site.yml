name: Refresh Pokemon Site Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update site data
        env:
          SNKR_BATCH: "0"
        run: node work/update_pokemon_site.js

      - name: Resolve all Snkrdunk direct links
        env:
          SNKR_BATCH: "0"
          SNKR_CONCURRENCY: "20"
          SNKR_CHECKPOINT: "100"
          SNKR_RECHECK_DAYS: "30"
        run: node work/update_snkr_links.js

      - name: Expand Cardrush direct links
        run: node work/update_cardrush_links.js

      - name: Record 91-day market history and rebuild market analysis
        run: node work/build_market_analysis.js

      - name: Record daily decisions and rebuild backtest
        run: node work/build_market_backtest.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pokemon-cards.json data/pokemon-cards-meta.json data/market-stability-summary.json data/market-backtest-summary.json work/market_stability_history.json work/market_backtest_history.json work/snkr_link_progress.json work/cardrush_catalog.json work/cardrush_invalid_urls.json work/cardrush_recheck_ids.json work/cardrush_crawl_progress.json work/cardrush_target_progress.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh Pokemon card data"
          git push
