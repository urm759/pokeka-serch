name: PokeDATA Incremental Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Discover public Japanese sets and isolate ambiguous codes
        run: node work/discover_pokedata_sets.js
      - name: Select next verified Japanese set
        run: node work/select_pokedata_set.js
      - name: Continue public PokeDATA checkpoint
        if: env.POKEDATA_SET_READY == '1'
        env:
          POKEDATA_TIMEOUT_MS: "10000"
          TRACKED_ALLOW_PARTIAL: "1"
          POKEDATA_BUDGET_MS: "360000"
          POKEDATA_DAILY_CAP: "200"
        run: node work/run_tracked_update.js pokedata work/run_pokedata_backfill.js
      - name: Record PokeDATA transient error rate and acquisition count
        if: env.POKEDATA_SET_READY == '1' && always()
        run: node work/record_pokedata_rate.js
      - name: Rebuild affected public summaries
        if: env.POKEDATA_SET_READY == '1'
        run: |
          node work/audit_pokedata_matches.js
          node work/build_market_research.js
          node work/audit_link_coverage.js
          node work/build_card_completion.js
          node work/audit_completion_outcomes.js
          node work/finalize_update_status.js
          node work/build_purchase_limit_audit.js
          node work/build_supply_maturity_hypothesis.js
          node work/audit_acquisition_progress.js
          node work/audit_link_coverage.js
          node work/finalize_update_status.js
      - name: Verify shared purchase limits before publishing
        if: env.POKEDATA_SET_READY == '1'
        run: |
          node work/build_ui_data.js
          node work/test_ui_data.js
          node work/test_pokedata_set_discovery.js
          node work/test_acquisition_progress.js
          node work/test_checkpoint_publication.js
          node work/test_source_monitor_and_completion.js
          node work/test_completion_routes.js
          node work/test_acquisition_resilience.js
          node work/test_psa_resilience.js
          node work/test_buyback_scenario_limits.js
          node work/test_purchase_limit_audit.js
          node work/test_preset_exploration.js
          node work/test_grade_calibration.js
          node work/test_supply_maturity_hypothesis.js
      - name: Commit discovery and checkpoint progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          if git diff --cached --quiet; then exit 0; fi
          node work/publish_data_checkpoint.js "Continue incremental data backfill"
      - name: Preserve recovery position if a required step failed
        if: failure()
        run: |
          node work/save_backfill_recovery.js pokedata
          node work/publish_data_checkpoint.js --capture-only
      - name: Upload unpublished source data and checkpoints
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pokedata-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/publish-recovery.bundle
            work/publish-recovery.json
            data/backfill-recovery.json
          retention-days: 7
          if-no-files-found: error
