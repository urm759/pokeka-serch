name: Safe Checkpoint Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Continue bounded source checkpoints without an LLM
        run: |
          node work/scheduled_cycle_evidence.js safe --baseline
          node work/run_safe_backfill.js
      - name: Consume prioritized completion queue without an LLM
        run: |
          node work/discover_state_a_urls.js
          node work/consume_completion_queue.js
      - name: Discover official PSA set links without bypassing authentication
        run: node work/discover_psa_set_urls.js --optional-permission
      - name: Rebuild completion and publication summaries
        run: |
          node work/reconcile_saved_psa_summary.js
          node work/build_card_completion.js
          node work/build_psa_linkage_queue.js
          node work/audit_completion_outcomes.js
          node work/build_purchase_limit_audit.js
          node work/build_supply_maturity_hypothesis.js
          node work/audit_acquisition_progress.js
          node work/audit_link_coverage.js
          node work/audit_candidate_reduction.js
          node work/finalize_update_status.js
      - name: Check publication safety
        run: |
          if [ "$(node work/update_validation.js --mode)" = "regression" ]; then
            node work/test_psa_saved_rematch.js
            node work/test_gemrate_reference_display.js
            node work/test_gemrate_limited_public_reference.js
            node work/test_saved_psa_summary.js
            node work/test_profile_worker.js
            node work/test_hareruya_single_response.js
            node work/test_profile_report_names.js
            node work/test_saved_shop_recovery.js
            node work/test_stock_history_statistics.js
            node work/test_postpass_cadence.js
            node work/test_coverage_capacity_filters.js
            node work/test_bulk_individual_freshness.js
            node work/test_catalog_history_retention.js
            node work/test_partial_buyback_refresh.js
            node work/test_partial_buyback_recovery.js
            node work/test_saved_camp_recovery.js
            node work/build_ui_data.js
            node work/measure_performance_guard.js
            node work/build_ui_data.js
            node work/test_ui_data.js
            node work/test_priority_finalize_handoff.js
            node work/test_ui_codec_v2.js
            node work/test_psa9_guide_comparison.js
            node work/test_psa9_guide_integration.js
            node work/test_psa9_marketplace_reference.js
            node work/test_psa9_cost_filters.js
            node work/test_initial_calculation_dependencies.js
            node work/test_specification_reexploration.js
            node work/test_performance_guard.js
            node work/test_performance_comparison.js
            node work/test_scheduled_cycle_evidence.js
            node work/test_cycle_observation_snapshot.js
            node work/test_price_integrity.js
            node work/test_price_comparison.js
            node work/test_profile_departure_audit.js
            node work/test_observation75_migration.js
            node work/test_pop_glance.js
            node work/test_pop_resilience.js
            node work/test_private_overseas_analysis.js
            node work/test_overseas_cancellation.js
            node work/test_return_reference.js
            node work/test_candidate_daily_audit.js
            node work/test_candidate_availability_audit.js
            node work/test_acquisition_progress.js
            node work/test_checkpoint_publication.js
            node work/test_publication_lineage.js
            node work/test_minimum_recovery_sources.js
            node work/test_recovery_latency.js
            node work/test_recovery_and_url_discovery.js
            node work/test_source_monitor_and_completion.js
            node work/test_source_access_display.js
            node work/test_evidence_refresh.js
            node work/test_incremental_linkage_evidence.js
            node work/test_operational_freshness.js
            node work/build_psa9_provenance.js --verify
            node work/test_completion_routes.js
            node work/test_keyed_render_and_completion.js
            node work/test_acquisition_resilience.js
            node work/test_psa_resilience.js
            node work/test_psa_completion_publication.js
            node work/test_deadline_capacity_samples.js
            node work/test_psa10_period_statistics.js
            node work/test_exploration_metrics.js
            node work/test_card_efficiency.js
            node work/test_period_efficiency_average.js
            node work/test_search_profile_cycle.js
            node work/test_profile_completion_routes.js
            node work/test_median_primary.js
            node work/test_supply_demand_validation.js
            node work/test_research_evidence_gate.js
            node work/test_profile_discovery_gates.js
            node work/test_buyback_support.js
            node work/test_buyback_market_average.js
            node work/test_buyback_scope.js
            node work/test_style_identity.js
            node work/test_saved_style_replay.js
            node work/test_saved_buyback_item_rematch.js
            node work/test_market_buyback_day_order.js
            node work/test_final_price_status_pack.js
            node work/test_saved_trainer_name_scope.js
            node work/test_failed_price_recovery.js
            node work/test_buyback_saved_identity_recovery.js
            node work/test_buyback_mean_status.js
            node work/test_public_mail_buybacks.js
            node work/test_timestamp_formatter_reuse.js
            node work/test_buyback_highest_search.js
            node work/test_saved_source_merge.js
            node work/test_optional_source_publication.js
            node work/test_psa10_trade_statistics.js
            node work/test_psa_growth_provenance.js
            node work/test_profile_basis_transitions.js
            node work/test_profile_candidate_evidence.js
            node work/test_profile_buyback_unmatched.js
            node work/test_safe_backfill.js
            node work/test_purchase_limit_audit.js
            node work/test_preset_exploration.js
            node work/test_supply_maturity_hypothesis.js
            node work/test_update_validation.js
            node work/test_update_publication.js
            node work/test_value_reopening.js
            node work/test_reference_buy.js
            node work/test_gemrate_reference_refresh.js
            node work/test_daily_finalize_once.js
          else
            node work/update_validation.js --required
          fi
          node work/update_validation.js --record
      - name: Commit safe progress and checkpoints
        run: |
          node work/scheduled_cycle_evidence.js safe
          node work/build_ui_data.js
          node work/test_ui_data.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          if git diff --cached --quiet; then exit 0; fi
          node work/publish_data_checkpoint.js "Continue safe checkpoint backfill"
      - name: Preserve recovery position if a required step failed
        if: failure()
        run: node work/capture_unpublished_data.js safe
      - name: Record safe recovery metadata independently
        if: failure()
        run: |
          node work/save_backfill_recovery.js safe
      - name: Upload unpublished source data and checkpoints
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: safe-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/unpublished-recovery/
            work/publish-recovery.bundle
            work/publish-recovery.json
            data/backfill-recovery.json
          retention-days: 7
          if-no-files-found: error
