name: Refresh Cardrush Stock

on:
  workflow_dispatch:
  schedule:
    # 00:00 JST every day (GitHub Actions cron uses UTC).
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: cardrush-stock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh all Cardrush listings
        env:
          CARDRUSH_REFRESH_ALL: "1"
          CARDRUSH_SEED_BATCH: "0"
          CARDRUSH_TARGET_BATCH: "200"
          CARDRUSH_CONCURRENCY: "2"
        run: node work/update_cardrush_links.js

      - name: Record stock and audit states
        env:
          CARDRUSH_REQUIRE_FRESH: "1"
        run: node work/update_cardrush_stock.js

      - name: Re-resolve changed URLs
        env:
          CARDRUSH_SKIP_SEEDS: "1"
          CARDRUSH_TARGET_BATCH: "120"
          CARDRUSH_CONCURRENCY: "2"
        run: node work/update_cardrush_links.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pokemon-cards.json data/pokemon-cards-meta.json data/cardrush-stock-summary.json work/cardrush_catalog.json work/cardrush_stock_history.json work/cardrush_stock_misses.json work/cardrush_invalid_urls.json work/cardrush_recheck_ids.json work/cardrush_crawl_progress.json work/cardrush_target_progress.json
          if git diff --cached --quiet; then
            echo "No stock changes."
            exit 0
          fi
          git commit -m "Refresh Cardrush stock"
          git push
