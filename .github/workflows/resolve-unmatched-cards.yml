name: Deep Resolve Unmatched Cards

on:
  workflow_dispatch:
  schedule:
    # 09:13 JST: one unresolved-link pass; avoid top-of-hour scheduling load.
    - cron: "13 0 * * *"

permissions:
  contents: write

concurrency:
  group: deep-card-link-resolution
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve unresolved Snkrdunk links
        env:
          SNKR_BATCH: "0"
          SNKR_RECHECK_DAYS: "30"
        run: node work/update_snkr_links.js
      - name: Resolve unresolved Cardrush links
        env:
          CARDRUSH_SEED_BATCH: "40"
          CARDRUSH_TARGET_BATCH: "600"
          CARDRUSH_CONCURRENCY: "2"
        run: node work/update_cardrush_links.js
      - name: Resolve unresolved Hareruya2 links
        env:
          HARERUYA2_COLLECTION_BATCH: "120"
          HARERUYA2_STOCK_BATCH: "1"
        run: node work/update_hareruya2_stock.js
      - name: Rebuild evaluations
        run: node work/build_evaluation_model.js
      - name: Record link coverage
        run: node work/audit_link_coverage.js
      - name: Preserve resolved inputs before validation
        run: node work/capture_unpublished_data.js monitor-prevalidation
      - name: Validate and publish resolved mappings
        run: |
          node work/build_card_completion.js
          node work/build_purchase_limit_audit.js
          node work/finalize_update_status.js
          node work/update_validation.js --required
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          node work/enforce_overseas_publication.js --verify --staged
          node work/publish_data_checkpoint.js "Resolve unmatched card links"
      - name: Retain saved originals when validation or publication stops
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: deep-resolution-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/unpublished-recovery/
            work/publish-recovery.bundle
            work/publish-recovery.json
          if-no-files-found: ignore
          retention-days: 7
