name: GemRate Code Checks
on:
  pull_request:
    paths:
      - 'work/gemrate*.js'
      - 'work/gemrate*.json'
      - 'work/run_gemrate*.js'
      - 'work/test_gemrate*.js'
      - 'work/restore_price_artifact.js'
      - 'work/reconcile_saved_source_merge.js'
      - 'work/test_failed_price_recovery.js'
      - 'work/test_saved_source_merge.js'
      - 'work/pc_*.js'
      - 'work/run_pc_freshness_bridge.js'
      - 'work/test_pc_*.js'
      - 'work/priority_price_queue.js'
      - 'work/previous_qualified_reference.js'
      - 'work/test_previous_qualified_reference.js'
      - 'work/camp_postpass.js'
      - 'work/camp_collection_batch.js'
      - 'work/test_camp_collection_batch.js'
      - 'work/source_batch_metrics.js'
      - 'work/shop_finish_identity.js'
      - 'work/quarantine_shop_identity.js'
      - 'work/test_shop_finish_identity.js'
      - 'work/update_yuyutei_torecacamp.js'
      - 'work/run_priority_price_refresh.js'
      - 'work/test_postpass_cadence.js'
      - 'work/gemrate-collector-extension/**'
      - 'ops/external-wakeup/**'
      - 'work/cloud_wakeup_policy.js'
      - 'work/refresh_cadence.js'
      - 'work/multi_pipeline_timing.js'
      - 'work/shop_effect_baseline.js'
      - 'work/ui_projection_cache.js'
      - 'work/recovery_checkout_proof.js'
      - 'work/external_timer_context.js'
      - 'work/test_external_wakeup.js'
      - 'work/test_orphan_wakeup.js'
      - 'work/test_stock_scope.js'
      - 'work/test_multi_pipeline_timing.js'
      - 'work/test_shop_effect_baseline.js'
      - 'work/test_ui_projection_cache.js'
      - 'work/test_recovery_checkout_proof.js'
      - 'work/resolve_generated_merge.js'
      - 'work/test_generated_merge_finalization.js'
      - '.github/workflows/gemrate-code-checks.yml'
permissions:
  contents: read
jobs:
  related-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Offline receipt and exact-identity regressions
        run: |
          node --check work/gemrate-collector-extension/service-worker.js
          node work/test_gemrate_collector.js
          node work/test_gemrate_receipt_filename.js
          node work/test_gemrate_identity_match.js
          node work/test_gemrate_confirmed_links.js
          node work/test_gemrate_private_inbox.js
          node work/test_gemrate_reference_refresh.js
          node work/test_gemrate_multiset.js
          node work/test_gemrate_s4a_scope.js
          node work/test_gemrate_sm11b_scope.js
          node work/test_pc_freshness_bridge.js
          node work/test_multi_pipeline_timing.js
          node work/test_shop_effect_baseline.js
          node work/test_ui_projection_cache.js
          node work/test_external_wakeup.js
          node work/test_orphan_wakeup.js
          node work/test_stock_scope.js
          node work/test_recovery_checkout_proof.js
          node work/test_generated_merge_finalization.js
          node work/test_pc_domestic_checkpoint.js
          node work/test_previous_qualified_reference.js
          node work/test_deadline_order.js
          node work/test_postpass_cadence.js
          node work/test_camp_collection_batch.js
          node work/test_shop_finish_identity.js
          node work/test_failed_price_recovery.js
          node work/test_saved_source_merge.js
          node work/test_publication_merge_inputs.js
          node work/test_profit_outcomes.js
          node work/test_generated_merge_large_json.js
          node work/test_buyback_adapter_deadline.js
          node work/test_homura_public_feed.js
          node work/test_gemrate_pop_history.js
          node work/test_gemrate_worker.js
          node work/test_gemrate_reference_checkpoint.js
