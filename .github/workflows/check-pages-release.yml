name: Check published Pages release
run-name: Pages release from ${{ github.event.workflow_run.event || github.event_name }}
on:
  workflow_run:
    # Reuse the established Watch schedule. The built-in Pages run emits no usable trigger here.
    workflows: [Data Update Health Watchdog]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PAGES_RUNS_PATH: 'actions/runs?branch=main&event=dynamic&status=success&per_page=30'
  PAGES_SUCCESSFUL_HEAD: >-
    [.workflow_runs[] | select(.name == "pages build and deployment" and .head_branch == "main"
    and .conclusion == "success" and (.head_repository.full_name // "") == (.repository.full_name // "!"))]
    | max_by(.updated_at) | .head_sha // ""
concurrency:
  group: pages-release-verification
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Find the latest successfully published commit
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The legacy build inventory can report a successfully deployed commit as errored.
          target=$(gh api "repos/$GITHUB_REPOSITORY/$PAGES_RUNS_PATH" --jq "$PAGES_SUCCESSFUL_HEAD")
          [[ "$target" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Published commit $target"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pages.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check served scripts, integrity, manifest and offline invariants
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ steps.pages.outputs.sha }}
        run: |
          for attempt in 1 2 3; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/$PAGES_RUNS_PATH" --jq "$PAGES_SUCCESSFUL_HEAD")
            [[ "$latest" =~ ^[a-f0-9]{40}$ ]]
            if [[ "$latest" != "$DEPLOYED_SHA" ]]; then
              # Keep the verification tied to the served commit when a deployment completes mid-run.
              git fetch --depth=1 origin "$latest"
              git checkout --detach FETCH_HEAD
              DEPLOYED_SHA=$latest
              echo "Published commit advanced to $latest"
            fi
            if node work/check_pages_release.js; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 20; fi
          done
          exit 1
