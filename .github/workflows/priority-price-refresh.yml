name: Priority Purchase Price Refresh
on:
  workflow_dispatch:
  schedule:
    # Odd JST hours at :20. Queue checks every 2h; important-card target is 6h.
    - cron: "20 */2 * * *"
permissions:
  contents: write
concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Refresh due purchase prices without new-set exploration or LLM
        run: |
          node work/scheduled_cycle_evidence.js priority --baseline
          node work/refresh_cadence.js
          node work/run_priority_price_refresh.js
      - name: Verify safety and incremental acquisition
        run: |
          node work/test_profile_worker.js
          node work/test_psa_saved_rematch.js
          node work/test_profile_report_names.js
          node work/test_saved_shop_recovery.js
          node work/test_stock_history_statistics.js
          node work/build_ui_data.js
          node work/measure_performance_guard.js
          node work/build_ui_data.js
          node work/test_ui_data.js
          node work/test_exploration_metrics.js
          node work/test_card_efficiency.js
          node work/test_period_efficiency_average.js
          node work/test_search_profile_cycle.js
          node work/test_profile_completion_routes.js
          node work/test_profile_discovery_gates.js
          node work/test_buyback_support.js
          node work/test_homura_public_feed.js
          node work/test_buyback_highest_search.js
          node work/test_saved_source_merge.js
          node work/test_optional_source_publication.js
          node work/test_price_payload_gate.js
          node work/test_saved_domestic_recovery.js
          node work/test_psa10_trade_statistics.js
          node work/test_psa_growth_provenance.js
          node work/test_profile_basis_transitions.js
          node work/test_profile_candidate_evidence.js
          node work/test_profile_buyback_unmatched.js
          node work/test_specification_reexploration.js
          node work/test_performance_guard.js
          node work/test_performance_comparison.js
          node work/test_scheduled_cycle_evidence.js
          node --check app.js
          node work/test_priority_refresh.js
          node work/test_keyed_render_and_completion.js
          node work/test_proactive_refresh.js
          node work/test_deadline_order.js
          node work/test_deadline_capacity_samples.js
          node work/test_roi_psa9_ratio.js
          node work/test_bulk_individual_freshness.js
          node work/test_partial_buyback_refresh.js
          node work/test_partial_buyback_recovery.js
          node work/test_saved_camp_recovery.js
          node work/test_purchase_memo.js
          node work/test_return_reference.js
          node work/test_buyback_scenario_limits.js
          node work/test_purchase_limit_audit.js
          node work/test_median_efficiency.js
          node work/test_evidence_refresh.js
          node work/test_incremental_linkage_evidence.js
          node work/test_operational_freshness.js
          node work/build_psa9_provenance.js --verify
          node work/test_median_primary.js
          node work/test_supply_demand_validation.js
          node work/test_research_evidence_gate.js
          node work/test_preset_exploration.js
          node work/test_price_integrity.js
          node work/test_price_comparison.js
          node work/test_profile_departure_audit.js
          node work/test_observation75_migration.js
          node work/test_pop_glance.js
          node work/test_pop_resilience.js
          node work/test_private_overseas_analysis.js
          node work/test_overseas_cancellation.js
          node work/test_shop_observation.js
          node work/test_purchase_price_recovery.js
          node work/test_card_catalog_completion.js
          node work/test_checkpoint_publication.js
          node work/test_recovery_and_url_discovery.js
          node work/test_cadence_payload.js
          node work/test_automatic_operation.js
          node work/test_monitor_isolation.js
      - name: Publish validated data with conflict protection
        run: |
          node work/scheduled_cycle_evidence.js priority
          node work/build_ui_data.js
          node work/test_ui_data.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          node work/publish_data_checkpoint.js "Refresh due priority purchase prices"
      - name: Report independent acquisition failures without hiding them
        run: node work/run_priority_price_refresh.js --report-failures
      - name: Preserve unpublished checkpoint on failure
        if: failure()
        run: node work/capture_unpublished_data.js priority-prices
      - name: Record failure metadata independently
        if: failure()
        run: |
          node work/save_backfill_recovery.js priority-prices
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: priority-price-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/unpublished-recovery/
            work/publish-recovery.bundle
            work/publish-recovery.json
            data/backfill-recovery.json
          retention-days: 7
          if-no-files-found: error
