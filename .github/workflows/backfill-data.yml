name: Incremental Data Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Continue Yu-Yu-Tei checkpoint
        continue-on-error: true
        env:
          SHOP_SOURCE_ONLY: yuyutei
          YUYUTEI_SEARCH_BATCH: "30"
          YUYUTEI_CONCURRENCY: "1"
          TRACKED_TIMEOUT_MS: "480000"
        run: node work/run_tracked_update.js yuyutei work/update_yuyutei_torecacamp.js
      - name: Continue Toreca Camp checkpoint
        continue-on-error: true
        env:
          SHOP_SOURCE_ONLY: torecacamp
          TORECACAMP_SITEMAPS_PER_RUN: "1"
          TORECACAMP_PRODUCT_DETAIL_BATCH: "80"
          TORECACAMP_RUNTIME_LIMIT_MS: "420000"
        run: node work/run_tracked_update.js torecacamp work/update_yuyutei_torecacamp.js
      - name: Continue public PokeDATA checkpoint
        continue-on-error: true
        env:
          POKEDATA_SET: Pokemon Card 151 Japanese
          POKEDATA_TARGET: "516"
          POKEDATA_BATCH: "10"
          POKEDATA_INTERVAL_MS: "1100"
          POKEDATA_TIMEOUT_MS: "10000"
        run: node work/run_tracked_update.js pokedata work/update_pokedata_batch.js
      - name: Rebuild affected public summaries
        run: |
          node work/audit_pokedata_matches.js
          node work/build_market_research.js
          node work/audit_link_coverage.js
          node work/build_card_completion.js
          node work/finalize_update_status.js
      - name: Commit checkpoint progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Continue incremental data backfill"
          git push
