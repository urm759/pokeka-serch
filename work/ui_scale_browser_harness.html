<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Local Production DOM Benchmark</title>
<style>body{font:16px sans-serif;margin:8px}iframe{display:block;height:850px;border:1px solid #666}pre{white-space:pre-wrap}label,button{margin:8px}</style>
<h1>Local Production DOM Benchmark</h1>
<p>Same PC, simulated viewport. Synthetic double is not real acquisition. No public or user-profile settings are changed.</p>
<label>Width <select id="width"><option>1920</option><option>390</option></select></label>
<label>Catalog <select id="scale"><option value="normal">Normal / 60 displayed</option><option value="double">Synthetic double / 120 displayed</option></select></label>
<button id="load">Load Frozen Case</button><button id="run">Run 3 Repetitions</button>
<pre id="result">Ready</pre><iframe id="site" title="Production site under test"></iframe>
<script>
const frame=document.getElementById('site'),out=document.getElementById('result');
const saved=[];
document.getElementById('load').onclick=()=>{
  frame.style.width=document.getElementById('width').value+'px';
  frame.src='/'+document.getElementById('scale').value+'/?preset=specified&roi=0&psaMin=0&tx=0&tx7=0&psaTx=0&psaTx7=0&expProfit=0&expRoi=0&annual=0&filterExpRoi=0&profitBasis=auto&exitPolicy=both';
  out.textContent='Loading';
};
document.getElementById('run').onclick=async event=>{
  event.target.disabled=true;
  try{
    const doc=frame.contentDocument,button=doc.getElementById('benchmarkSearchButton');
    if(!doc.querySelector('[data-card-id]')||!button||button.disabled)throw Error('Case not ready');
    const scale=document.getElementById('scale').value;
    if(scale==='double'&&doc.querySelectorAll('[data-card-id]').length===60)doc.getElementById('loadMoreBtn').click();
    button.click();
    await new Promise((resolve,reject)=>{
      const started=Date.now();
      const timer=setInterval(()=>{if(!button.disabled){clearInterval(timer);resolve();}
        else if(Date.now()-started>120000){clearInterval(timer);reject(Error('Benchmark timeout'));}},100);
    });
    const measured=JSON.parse(doc.getElementById('searchBenchmarkResult').textContent);
    const cards=[...doc.querySelectorAll('[data-card-id]')].map(el=>({id:el.dataset.cardId,text:el.innerText}));
    const result={scale,...measured,cards,overflow:doc.documentElement.scrollWidth>frame.contentWindow.innerWidth,
      initial:doc.querySelector('.ui-load-metrics')?.textContent||null,
      initialMeasurements:JSON.parse(doc.querySelector('.ui-load-metrics')?.dataset.measurements||'[]')};
    saved.push(result);out.textContent=JSON.stringify(saved);
  }catch(error){out.textContent=String(error);}finally{event.target.disabled=false;}
};
</script></html>
