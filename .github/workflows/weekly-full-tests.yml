name: Weekly Full Regression Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 6"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax and JSON validation
        run: |
          node --check app.js
          node --check decision-model.js
          node -e "const fs=require('fs'),path=require('path');const walk=p=>fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(p,e.name)):path.extname(e.name)==='.json'?[path.join(p,e.name)]:[]);for(const f of walk('data'))JSON.parse(fs.readFileSync(f,'utf8').replace(/^\\uFEFF/,''));console.log('JSON OK')"
      - name: Full regression suite
        shell: bash
        run: for test in work/test_*.js; do node "$test"; done
