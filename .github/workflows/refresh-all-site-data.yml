name: Refresh All Site Data

on:
  workflow_dispatch:
  schedule:
    # 00:00 and 06:30 JST every day (GitHub Actions cron uses UTC).
    - cron: "0 15 * * *"
    - cron: "30 21 * * *"

permissions:
  contents: write

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update PSA Japan plans and turnaround times
        run: node work/update_psa_japan_services.js

      - name: Update Pokemon cards and prices
        env:
          SNKR_BATCH: "0"
        run: node work/update_pokemon_site.js

      - name: Resolve all Snkrdunk direct links
        env:
          SNKR_BATCH: "0"
          SNKR_CONCURRENCY: "20"
          SNKR_CHECKPOINT: "100"
          SNKR_RECHECK_DAYS: "30"
        run: node work/update_snkr_links.js

      - name: Cache Snkrdunk English names for PSA matching
        env:
          PSA_ENGLISH_BATCH: "120"
          PSA_ENGLISH_CONCURRENCY: "6"
        run: node work/update_snkr_english_names.js

      - name: Rebuild verified PSA history links
        run: node work/build_psa_history.js

      - name: Refresh all Cardrush listings and prices
        env:
          CARDRUSH_REFRESH_ALL: "1"
          CARDRUSH_SEED_BATCH: "0"
          CARDRUSH_TARGET_BATCH: "200"
          CARDRUSH_CONCURRENCY: "2"
        run: node work/update_cardrush_links.js

      - name: Record Cardrush stock and audit states
        env:
          CARDRUSH_REQUIRE_FRESH: "1"
        run: node work/update_cardrush_stock.js

      - name: Record shop PSA10 buyback listings
        run: node work/update_shop_buybacks.js

      - name: Re-resolve changed Cardrush URLs
        env:
          CARDRUSH_SKIP_SEEDS: "1"
          CARDRUSH_TARGET_BATCH: "120"
          CARDRUSH_CONCURRENCY: "2"
        run: node work/update_cardrush_links.js

      - name: Commit all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh all Pokemon site data"
          git push
