name: Data Update Health Watchdog

on:
  workflow_dispatch:
    inputs:
      timer_scheduled_at:
        description: 'Optional independent timer clock (not acquisition evidence)'
        required: false
        default: ''
      timer_request_id:
        description: 'Optional independent timer request ID'
        required: false
        default: ''
  workflow_run:
    workflows: [Daily Fast Update, Safe Checkpoint Backfill, Priority Purchase Price Refresh, Deep Resolve Unmatched Cards]
    types: [completed]
  schedule:
    # Offset from :20 price jobs; the shared 2h acquisition gate still limits requests.
    - cron: "47 * * * *"

permissions:
  contents: write
  actions: read

jobs:
  catchup:
    outputs:
      published_receipt_run_id: ${{ steps.publication.outcome == 'success' && steps.catchup_validation.outputs.receipt_run_id || '' }}
    if: >-
      github.event_name != 'workflow_run' ||
      ((((github.event.workflow_run.name == 'Deep Resolve Unmatched Cards' ||
          github.event.workflow_run.name == 'Safe Checkpoint Backfill' ||
          github.event.workflow_run.name == 'Daily Fast Update') &&
         github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success') ||
        ((github.event.workflow_run.name == 'Priority Purchase Price Refresh' ||
          github.event.workflow_run.name == 'Daily Fast Update' ||
          github.event.workflow_run.name == 'Safe Checkpoint Backfill') &&
         github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure')) &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: all-site-data-refresh

      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check alert deduplication and safe backoff rules
        run: |
          if [ "$(node work/update_validation.js --mode)" = "regression" ]; then
            node work/test_profile_worker.js
            node work/test_gemrate_limited_public_reference.js
            node work/test_gemrate_pop_history.js
            node work/test_hareruya_single_response.js
            node work/test_watch_catchup_trigger.js
            node work/test_failed_price_recovery.js
            node work/test_saved_source_merge.js
            node work/test_publication_merge_inputs.js
            node work/test_profit_outcomes.js
            node work/test_concurrent_price_publication.js
            node work/test_saved_retailer_links.js
            node work/test_buyback_market_average.js
            node work/test_buyback_scope.js
            node work/test_style_identity.js
            node work/test_saved_style_replay.js
            node work/test_saved_buyback_item_rematch.js
            node work/test_market_buyback_day_order.js
            node work/test_final_price_status_pack.js
            node work/test_saved_trainer_name_scope.js
            node work/test_profile_report_names.js
            node work/test_value_reopening.js
            node work/test_reference_buy.js
            node work/test_gemrate_reference_refresh.js
            node work/test_gemrate_confirmed_links.js
            node work/test_safe_camp_checkpoint.js
            node work/test_disclosure_retention.js
            node work/test_saved_shop_recovery.js
            node work/test_update_health.js
            node work/test_backfill_health.js
            node work/test_backfill_rate.js
            node work/test_deadline_order.js
            node work/test_minimum_recovery_sources.js
            node work/test_recovery_latency.js
            node work/test_scheduled_cycle_evidence.js
            node work/test_cycle_observation_snapshot.js
            node work/test_postpass_cadence.js
            node work/test_bulk_individual_freshness.js
            node work/test_catalog_history_retention.js
            node work/test_partial_buyback_refresh.js
            node work/test_partial_buyback_recovery.js
            node work/test_saved_camp_recovery.js
            node work/test_automatic_operation.js
            node work/test_overseas_cancellation.js
          fi
      - name: Recover trusted failed price inputs without reacquisition
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_PRICE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node work/recover_failed_price_run.js
      - name: Recover missed trusted Daily publication before optional acquisition
        if: github.event_name != 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node work/recover_failed_price_run.js --latest-daily
      - name: Check saved publication before optional acquisition
        # Restore the previous trusted monitor's normal raw inputs before deciding to fetch again.
        # The existing common acquisition gate and all publication validations still apply.
        id: restore_monitor
        if: github.event_name != 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node work/recover_failed_price_run.js --latest-monitor
      - name: Plan saved publication before optional acquisition
        id: catchup_plan
        run: node work/catchup_validation_mode.js
      - name: Fill missed price intervals with shared cooldown and access budgets
        if: steps.catchup_plan.outputs.mode == 'acquire'
        run: |
          node work/run_priority_price_refresh.js --catchup
      - name: Preserve compact acquired inputs before validation or publication conflicts
        if: steps.catchup_plan.outputs.mode != 'reuse'
        run: node work/capture_unpublished_data.js monitor-prevalidation
      - name: Retain compact monitor checkpoint independently
        if: steps.catchup_plan.outputs.mode != 'reuse'
        uses: actions/upload-artifact@v7
        with:
          name: monitor-prevalidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/unpublished-recovery/
          retention-days: 7
          if-no-files-found: error
      - name: Validate catchup data without changing purchase criteria
        id: catchup_validation
        run: |
          if [ "${{ steps.catchup_plan.outputs.mode }}" = "rebuild" ]; then
            PRICE_EVIDENCE_FETCH_LIMIT=0 node work/audit_state_a_prices.js
            node work/build_card_completion.js
            node work/finalize_update_status.js
          fi
          if [ "$(node work/update_validation.js --mode)" = "regression" ]; then
            node work/test_price_integrity.js
            node work/test_price_comparison.js
            node work/test_profile_departure_audit.js
            node work/test_observation75_migration.js
            node work/test_pop_glance.js
            node work/test_pop_resilience.js
            node work/test_shop_observation.js
            node work/test_purchase_price_recovery.js
            node work/test_buyback_scenario_limits.js
            node work/test_purchase_limit_audit.js
            node work/test_card_catalog_completion.js
            node work/test_cadence_payload.js
            node work/test_publication_lineage.js
            node work/test_catchup_reuse.js
            node work/test_ui_data.js
            node work/test_priority_finalize_handoff.js
            node work/test_ui_codec_v2.js
            node work/test_psa9_guide_comparison.js
            node work/test_psa9_guide_integration.js
            node work/test_psa9_marketplace_reference.js
            node work/test_psa9_cost_filters.js
            node work/test_initial_calculation_dependencies.js
            if [ "${{ steps.catchup_plan.outputs.mode }}" != "reuse" ]; then
              node work/measure_performance_guard.js
              node work/scheduled_cycle_evidence.js catchup
            fi
            node work/test_update_validation.js
            node work/test_update_publication.js
            node work/test_daily_finalize_once.js
          else
            node work/update_validation.js --required
            if [ "${{ steps.catchup_plan.outputs.mode }}" != "reuse" ]; then node work/scheduled_cycle_evidence.js catchup; fi
          fi
          node work/update_validation.js --record
          node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync('data/scheduled-cycle-receipts.json')).pipelines?.catchup;if(String(r?.runId)===process.env.GITHUB_RUN_ID)fs.appendFileSync(process.env.GITHUB_OUTPUT,'receipt_run_id='+r.runId+'\n');"
      - name: Publish changed health state only
        id: publication
        if: always() && steps.catchup_validation.outcome == 'success' && steps.catchup_plan.outputs.mode != 'reuse'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node work/build_ui_data.js
          node work/test_ui_data.js
          git add data work
          git add data/ui
          if git diff --cached --quiet; then exit 0; fi
          node work/publish_data_checkpoint.js "Report data update health"
      - name: Report independent acquisition failures without hiding them
        run: node work/run_priority_price_refresh.js --report-failures
      - name: Keep source merge holds visible without blocking normal updates
        id: source_holds
        if: always()
        run: node work/recover_failed_price_run.js --hold-status
      - name: Retain verified held source archives separately
        if: always() && steps.source_holds.outputs.pending == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: source-merge-holds-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/recovery-*.zip
            work/recovery-inspected-*.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve unpublished monitor state
        if: failure() && steps.publication.outcome != 'success'
        run: node work/capture_unpublished_data.js health
      - name: Save monitor recovery bundle
        if: failure() && steps.publication.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: monitor-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/unpublished-recovery/
            work/publish-recovery.bundle
            work/publish-recovery.json
          retention-days: 7
          if-no-files-found: warn
      - name: Retain published catchup source warnings
        if: failure() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: catchup-post-publication-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/priority-price-execution.json
            work/source-update-runs.json
            work/source-update-history.json
            work/publish-recovery.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain private mintrade source responses for missing-price diagnosis
        if: always() && hashFiles('.private/mintrade-source-captures/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mintrade-source-catchup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .private/mintrade-source-captures/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  watch:
    # Record the receipt only after the independent Pages check has finished.
    # always() preserves monitoring even when acquisition or verification fails.
    needs: [catchup, publication_check]
    if: always()
    concurrency:
      group: site-data-health-observation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Capture current catchup publication verification after acquisition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_TARGET_RUN_ID: ${{ needs.catchup.outputs.published_receipt_run_id }}
        run: node work/current_publication_check.js
      - name: Validate independent monitor
        run: |
          node work/test_update_health.js
          node work/test_monitor_isolation.js
          node work/test_cycle_observation_snapshot.js
      - name: Check workflow results and saved checkpoint holds
        id: observation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node work/watch_update_health.js
      - name: Publish independent validated monitor state
        id: publication
        if: always() && steps.observation.outcome == 'success'
        run: |
          node work/build_ui_data.js
          node work/test_ui_data.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work/automatic-workflow-evidence.json work/verified-price-cadence-history.json work/calendar-progress-history.json work/priority-freshness-history.json work/priority-price-checkpoint.json
          node work/publish_data_checkpoint.js "Publish independent data health observation"
      - name: Report newly detected alerts
        run: node work/watch_update_health.js --report-alerts
      - name: Report current publication verification failure separately
        if: always()
        run: node work/current_publication_check.js --report-failure
      - name: Retain current publication verification and original failure proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-publication-verification-${{ github.run_id }}
          path: |
            work/current-publication-check.json
            work/checkpoint-publication-proof.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve independent observation on failure
        if: failure() && steps.publication.outcome != 'success'
        run: node work/capture_unpublished_data.js monitor-only
      - uses: actions/upload-artifact@v7
        if: failure() && steps.publication.outcome != 'success'
        with:
          name: independent-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/unpublished-recovery/
          retention-days: 7
          if-no-files-found: error
      - name: Retain published monitor warnings
        if: failure() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: watch-post-publication-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/monitor-observation.json
            data/update-health.json
            work/publish-recovery.json
          retention-days: 14
          if-no-files-found: error

  publication_check:
    # No needs: catchup: observation/Pages verification must not wait on acquisition.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify published acquisition independently without source requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node work/audit_day_boundaries.js
          node work/verify_update_publication.js
      - name: Retain publication verification without a Pages feedback loop
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-verification-${{ github.run_id }}
          path: |
            work/checkpoint-publication-proof.json
            work/day-boundary-audit.json
          retention-days: 14
          if-no-files-found: error
