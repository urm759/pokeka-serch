name: Safe Checkpoint Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Continue bounded source checkpoints without an LLM
        run: |
          node work/scheduled_cycle_evidence.js safe --baseline
          node work/run_safe_backfill.js
      - name: Consume prioritized completion queue without an LLM
        run: |
          node work/discover_state_a_urls.js
          node work/consume_completion_queue.js
      - name: Discover official PSA set links without bypassing authentication
        run: node work/discover_psa_set_urls.js
      - name: Rebuild completion and publication summaries
        run: |
          node work/build_card_completion.js
          node work/audit_completion_outcomes.js
          node work/build_purchase_limit_audit.js
          node work/finalize_update_status.js
          node work/build_supply_maturity_hypothesis.js
          node work/audit_acquisition_progress.js
          node work/audit_link_coverage.js
          node work/finalize_update_status.js
      - name: Check publication safety
        run: |
          node work/test_postpass_cadence.js
          node work/build_ui_data.js
          node work/measure_performance_guard.js
          node work/build_ui_data.js
          node work/test_ui_data.js
          node work/test_specification_reexploration.js
          node work/test_performance_guard.js
          node work/test_performance_comparison.js
          node work/test_scheduled_cycle_evidence.js
          node work/test_price_integrity.js
          node work/test_return_reference.js
          node work/test_candidate_daily_audit.js
          node work/test_candidate_availability_audit.js
          node work/test_acquisition_progress.js
          node work/test_checkpoint_publication.js
          node work/test_recovery_and_url_discovery.js
          node work/test_source_monitor_and_completion.js
          node work/test_completion_routes.js
          node work/test_keyed_render_and_completion.js
          node work/test_acquisition_resilience.js
          node work/test_psa_resilience.js
          node work/test_safe_backfill.js
          node work/test_purchase_limit_audit.js
          node work/test_preset_exploration.js
          node work/test_supply_maturity_hypothesis.js
      - name: Commit safe progress and checkpoints
        run: |
          node work/scheduled_cycle_evidence.js safe
          node work/build_ui_data.js
          node work/test_ui_data.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data work
          if git diff --cached --quiet; then exit 0; fi
          node work/publish_data_checkpoint.js "Continue safe checkpoint backfill"
      - name: Preserve recovery position if a required step failed
        if: failure()
        run: node work/capture_unpublished_data.js safe
      - name: Record safe recovery metadata independently
        if: failure()
        run: |
          node work/save_backfill_recovery.js safe
      - name: Upload unpublished source data and checkpoints
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: safe-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/unpublished-recovery/
            work/publish-recovery.bundle
            work/publish-recovery.json
            data/backfill-recovery.json
          retention-days: 7
          if-no-files-found: error
