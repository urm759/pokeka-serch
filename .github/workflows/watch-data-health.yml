name: Data Update Health Watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Daily Fast Update, Safe Checkpoint Backfill, PokeDATA Incremental Backfill]
    types: [completed]
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: all-site-data-refresh
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check alert deduplication and safe backoff rules
        run: |
          node work/test_update_health.js
          node work/test_backfill_health.js
          node work/test_backfill_rate.js
      - name: Check workflow results and saved checkpoint holds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node work/watch_update_health.js
      - name: Publish changed health state only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/update-health.json
          if git diff --cached --quiet; then exit 0; fi
          node work/publish_data_checkpoint.js "Report data update health"
